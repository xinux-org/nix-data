name: Release CI

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: self-hosted
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Publish to crates.io
        run: nix develop --command -- cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

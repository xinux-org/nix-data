[package]
name = "nix-data-xinux"
version = "0.0.7"
edition = "2024"
license = "MIT"
description = "A set of modules for easily managing Nix and NixOS packages and options"
repository = "https://git.oss.uzinfocom.uz/xinux/nix-data"
readme = "README.md"
include = ["src/*", "Cargo.toml", "LICENSE*", "README.md"]
keywords = ["nix", "nixos", "nix-editor", "xinux"]
authors = [
  "Sokhibjon Orzikulov <sakhib@orzklv.uz>",
  "Victor Fuentes <vlinkz@snowflakeos.org>",
]

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "brotli", "json"] }
anyhow = "1.0.103"
lazy_static = "1.5"
brotli = "8"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
ijson = "0.1.6"

nix-editor = "0.3.0"
log = "0.4.30"
pretty_env_logger = "0.5"

sqlx = { version = "0.9.0", features = ["tls-native-tls","sqlite"] }
tokio = { version = "1.52.3", features = ["full"] }
csv = "1.3"
